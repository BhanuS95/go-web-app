apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-web-app
  labels:
    app: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: go-web-app
        image: bhanus95/go-web-app:v1
        ports:
        - containerPort: 8080
