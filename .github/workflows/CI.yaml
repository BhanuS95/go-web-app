name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'K8s/**'
      - 'helm/**'

jobs:
  
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build the Go application
        run: go build -o go-web-app

      - name: Run tests
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push action
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}

  update-new-tag-in-helm-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update Helm chart with new Docker image tag
        run: |
          NEW_TAG=${{ github.run_id }}
          sed -i "s/tag:.*/tag: \"${NEW_TAG}\"/" helm/go-web-app-chart/values.yaml
    
      - name: Commit and push changes
        run: |
          git config --global user.name "bhanus95"
          git config --global user.email "bs.shakya55@gmail.com"
          git add helm/go-web-app-chart/values.yaml
          git commit -m "Update Docker image tag in Helm chart"
          git push origin main  